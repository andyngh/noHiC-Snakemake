name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Dry-run:
    name: Build the job graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snakemake
        run: pip install "snakemake>=8.0"

      - name: Create placeholder inputs
        run: bash .test/setup.sh

      # Parses workflow/Snakefile, imports all five sub-workflows as modules and builds
      # the complete DAG. No bioinformatics tool is installed or executed.
      - name: Dry run with every stage enabled
        working-directory: .test
        run: |
          snakemake --snakefile ../workflow/Snakefile \
                    --configfile config/nohic.yaml \
                    --workflow-profile none \
                    --dry-run --cores 2

  Config-checks:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snakemake
        run: pip install "snakemake>=8.0"

      - name: Create placeholder inputs
        run: bash .test/setup.sh

      # The master workflow refuses to start when a stage is switched off without its
      # downstream input being filled in by hand. Check that the error still fires.
      - name: Missing chained input is reported
        working-directory: .test
        run: |
          sed 's/^  refpick:   "yes"/  refpick:   "no"/' config/nohic.yaml > config/no-refpick.yaml
          if snakemake --snakefile ../workflow/Snakefile \
                       --configfile config/no-refpick.yaml \
                       --workflow-profile none \
                       --dry-run --cores 2 >log.txt 2>&1; then
            echo "::error::workflow started although a chained input is missing"
            exit 1
          fi
          cat log.txt
          grep -q "missing from the config file" log.txt

      # The shipped configuration must stay valid YAML.
      - name: config/nohic.yaml parses
        run: python -c "import yaml,sys; yaml.safe_load(open('config/nohic.yaml'))"

# Note on linting: `snakemake --lint` reports that the rules define no conda environment
# or container. That is intentional here - noHiC runs every rule inside one shared
# virtual environment via shell.prefix - so the lint step is deliberately not part of CI.
